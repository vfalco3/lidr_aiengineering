[project]
name = "estimador-cag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vicente Falco", email = "vicente.falco@gmail.com" }
]
requires-python = ">=3.7"
dependencies = [
    "anthropic>=0.26.0",
    "fastapi>=0.103.2",
    "pydantic-settings>=2.0.3",
    "python-dotenv>=0.21.1",
    "structlog>=23.1.0",
    "uvicorn[standard]>=0.22.0",
]

[project.scripts]
estimador-cag = "estimador_cag:main"

[build-system]
