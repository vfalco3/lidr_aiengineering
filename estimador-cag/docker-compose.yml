# Servicios de apoyo para el estimador en local.
#
# Solo levanta Redis, que usa la caché exacta (REDIS_URL=redis://localhost:6379/0).
# La API se ejecuta fuera de Docker, con uvicorn, leyendo el .env de este directorio:
#
#   docker compose up -d
#   uv run uvicorn app.main:app --reload --port 8000

services:
  redis:
    image: redis:7-alpine
    container_name: estimador-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  redis_data:
